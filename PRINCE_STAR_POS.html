<title>Prince Star — Hisaab-Kitaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --ink:#0B0B0D; --ink2:#17171B; --panel:#1C1C21;
    --gold:#D4AF37; --gold-light:#F0D67D; --gold-dark:#9C7A1E;
    --parchment:#F7F4EC; --slate:#8A8A93; --slate-d:#5B5B63;
    --emerald:#2F6B4F; --garnet:#9B3B3B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--parchment);color:#1a1a1d;-webkit-tap-highlight-color:transparent;}
  .crown{font-family:'Cinzel',serif;}
  button{cursor:pointer;font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(212,175,55,.35);border-radius:4px;}

  /* ============ LOGIN ============ */
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background: radial-gradient(circle at 30% 20%, #1a1a1e 0%, #0B0B0D 55%), var(--ink);
    padding:20px;}
  .box{width:100%;max-width:400px;animation:fadeUp .5s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .logo-img{width:110px;height:110px;display:block;margin:0 auto 14px;border-radius:50%;
    box-shadow:0 0 0 1px rgba(212,175,55,.35), 0 14px 40px rgba(212,175,55,.15);
    background:#000;object-fit:cover;}
  .brand-title{text-align:center;color:var(--gold-light);font-size:26px;letter-spacing:.06em;margin-bottom:2px;}
  .brand-sub{text-align:center;color:var(--slate);font-size:11px;text-transform:uppercase;letter-spacing:.16em;margin-bottom:26px;}
  .glass{background:linear-gradient(180deg, rgba(28,28,33,.9), rgba(20,20,24,.9));
    border:1px solid rgba(212,175,55,.18);border-radius:16px;padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:10.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .field input{width:100%;background:#0f0f12;border:1px solid rgba(212,175,55,.18);color:var(--parchment);
    border-radius:9px;padding:12px 13px;outline:none;transition:border-color .2s;}
  .field input:focus{border-color:var(--gold);}
  .btn{border:none;border-radius:9px;padding:12px 18px;font-weight:600;font-size:14px;transition:transform .15s, box-shadow .2s;}
  .btn:active{transform:scale(.97);}
  .btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold) 60%,var(--gold-dark));
    color:#1a1503;width:100%;box-shadow:0 8px 22px rgba(212,175,55,.28);}
  .btn-gold:hover{box-shadow:0 10px 28px rgba(212,175,55,.4);}
  .btn-dark{background:var(--ink);color:var(--parchment);}
  .btn-dark:hover{background:#000;}
  .btn-ghost{background:rgba(212,175,55,.08);color:var(--gold-dark);border:1px solid rgba(212,175,55,.25);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .hint{color:var(--slate);font-size:11.5px;line-height:1.7;text-align:center;margin-top:16px;}
  .msg{padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:12px;}
  .msg-ok{background:rgba(47,107,79,.14);color:#7fbf9f;}
  .msg-err{background:rgba(155,59,59,.15);color:#e08585;}

  /* ============ APP ============ */
  #app-screen{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:236px;flex-shrink:0;background:linear-gradient(180deg,var(--ink) 0%,#000 100%);
    min-height:100vh;display:flex;flex-direction:column;border-right:1px solid rgba(212,175,55,.1);}
  .sidebar-head{padding:22px 20px;border-bottom:1px solid rgba(212,175,55,.12);display:flex;align-items:center;gap:10px;}
  .sidebar-head img{width:38px;height:38px;border-radius:50%;}
  .sidebar-head .brand{color:var(--gold-light);font-size:17px;letter-spacing:.03em;}
  .sidebar-head .role{color:var(--slate);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;}
  .nav{flex:1;padding:14px 0;}
  .nav button{display:block;width:100%;text-align:left;padding:12px 20px;background:none;border:none;
    border-left:2px solid transparent;color:var(--slate);font-size:14px;transition:.15s;}
  .nav button:hover{color:var(--parchment);background:rgba(212,175,55,.05);}
  .nav button.active{color:var(--gold-light);border-left-color:var(--gold);background:rgba(212,175,55,.07);}
  .sidebar-foot{padding:16px 20px;border-top:1px solid rgba(212,175,55,.1);}
  .sidebar-foot .name{color:var(--parchment);font-size:13px;}
  .sidebar-foot button{background:none;border:none;color:var(--slate);font-size:12px;margin-top:6px;padding:0;}
  .sidebar-foot button:hover{color:var(--gold);}

  .main{flex:1;padding:28px 32px;overflow-x:hidden;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .page-head h1{font-family:'Cinzel',serif;font-size:24px;color:#141416;}
  .page-head p{color:var(--slate-d);font-size:13px;margin-top:2px;}

  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.sidebar{position:fixed;left:-236px;z-index:60;transition:left .2s;height:100vh;}
    .sidebar.open{left:0;}.main{padding:16px;}.grid-4{grid-template-columns:1fr;}
    .card{padding:14px;border-radius:12px;}
    .page-head h1{font-size:20px;}
    table{font-size:12px;}
    thead th{padding:8px;}
    tbody td{padding:8px;}
    .form-grid{grid-template-columns:1fr !important;}
  }

  .card{background:#fff;border-radius:16px;padding:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -14px rgba(0,0,0,.16);
    border:1px solid rgba(212,175,55,.08);transition:box-shadow .2s;}
  .card:hover{box-shadow:0 1px 2px rgba(0,0,0,.05),0 16px 34px -14px rgba(212,175,55,.22);}
  .stat-label{color:var(--slate-d);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;}
  .stat-value{font-family:'Cinzel',serif;font-size:25px;margin-top:6px;color:#141416;}
  .stat-value.pos{color:var(--emerald);}
  .stat-value.neg{color:var(--garnet);}
  .stat-hint{color:var(--slate-d);font-size:11px;margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;color:var(--slate-d);font-size:10.2px;text-transform:uppercase;letter-spacing:.05em;
    padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.06);}
  thead th.right,td.right{text-align:right;}
  tbody td{padding:11px 12px;border-bottom:1px solid rgba(0,0,0,.045);}
  tbody tr:hover{background:rgba(212,175,55,.045);}
  .table-wrap{overflow-x:auto;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
  .badge-low{background:rgba(155,59,59,.1);color:var(--garnet);}
  .badge-ok{background:rgba(47,107,79,.1);color:var(--emerald);}

  .form-panel{margin-bottom:18px;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:800px){.form-grid{grid-template-columns:repeat(2,1fr);}}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;border:1px solid rgba(0,0,0,.12);
    border-radius:9px;padding:10px 11px;background:rgba(247,244,236,.7);}
  .form-grid input:focus,.form-grid select:focus{outline:none;border-color:var(--gold);}
  .form-grid label{display:block;font-size:10.2px;color:var(--slate-d);text-transform:uppercase;margin-bottom:4px;}

  .mobile-bar{display:none;background:var(--ink);color:var(--parchment);padding:13px 16px;
    align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;}
  .mobile-bar button{background:none;border:none;color:var(--gold-light);font-size:22px;}
  @media(max-width:600px){.mobile-bar{display:flex;}}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;}
  .sidebar-overlay.active{display:block;}

  .stock-input{width:68px;padding:6px 7px;border:1px solid rgba(0,0,0,.15);border-radius:7px;}
  .icon-btn{background:none;border:none;font-size:15px;padding:4px 7px;border-radius:6px;}
  .icon-btn:hover{background:rgba(0,0,0,.06);}
  .icon-btn.danger:hover{background:rgba(155,59,59,.1);}
  .empty-row{color:var(--slate-d);text-align:center;padding:22px;}
  .data-note{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);color:var(--gold-dark);
    font-size:12px;padding:9px 12px;border-radius:9px;margin-bottom:16px;}


  /* ---- v2 additions ---- */
  .cart-box{border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:12px;margin-bottom:12px;background:rgba(247,244,236,.5);}
  .cart-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.05);font-size:13px;}
  .cart-row:last-child{border-bottom:none;}
  .cart-row .name{flex:1;}
  .cart-row .qty-input{width:50px;padding:5px;border:1px solid rgba(0,0,0,.15);border-radius:6px;}
  .cart-empty{color:var(--slate-d);font-size:13px;text-align:center;padding:14px;}
  .summary-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--slate-d);}
  .summary-row.total{font-weight:700;font-size:16px;color:#141416;border-top:1px solid rgba(0,0,0,.1);margin-top:6px;padding-top:8px;}
  .tabs-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab-btn{padding:7px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.1);background:#fff;font-size:12.5px;color:var(--slate-d);}
  .tab-btn.active{background:var(--ink);color:var(--gold-light);border-color:var(--ink);}
  .kpi-sub{font-size:10px;color:var(--slate-d);margin-top:2px;}
  .field-full{grid-column:1/-1;}
  .link-btn{background:none;border:none;color:var(--gold-dark);font-size:12px;text-decoration:underline;padding:4px 0;}
  .img-preview{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid rgba(0,0,0,.12);display:block;margin:6px auto;}
  .product-thumb{width:38px;height:38px;object-fit:cover;border-radius:8px;border:1px solid rgba(0,0,0,.08);vertical-align:middle;margin-right:8px;}
  .upload-box{border:1.5px dashed rgba(212,175,55,.35);border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:12px;color:var(--slate-d);background:rgba(212,175,55,.04);}
  .upload-box:hover{border-color:var(--gold);}
  .prod-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;background:#eee;flex-shrink:0;}
  .prod-thumb-placeholder{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,#eee,#ddd);display:flex;align-items:center;justify-content:center;font-size:14px;color:#999;flex-shrink:0;}
  .prod-cell{display:flex;align-items:center;gap:10px;}
  .img-upload-box{border:2px dashed rgba(0,0,0,.15);border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:12.5px;color:var(--slate-d);}
  .img-upload-box:hover{border-color:var(--gold);}
  .img-preview{width:80px;height:80px;border-radius:10px;object-fit:cover;display:block;margin:0 auto 8px;}
  .settings-section{margin-bottom:22px;}
  .settings-section h3{font-size:15px;margin-bottom:10px;}
  @media print{
    body.printing-doc > *:not(#print-area){display:none !important;}
    #print-area{display:block !important;}
    body.printing-doc{background:#fff !important;}
  }
  #print-area{display:none;}
  #print-area, #print-area *{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .doc-frame{border:2px solid var(--gold);border-radius:4px;padding:28px;font-family:'Inter',sans-serif;color:#1a1a1a;}
  .inv-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;border-bottom:2px solid var(--gold);padding-bottom:14px;}
  .inv-head img{width:56px;height:56px;border-radius:50%;}
  .inv-table{width:100%;border-collapse:collapse;margin:14px 0;}
  .inv-table th{background:rgba(212,175,55,.12);}
  .inv-table th,.inv-table td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px;}
  .kpi-sub{font-size:10px;color:var(--slate-d);margin-top:2px;}
  .card.kpi-gold{border-left:4px solid var(--gold);}
  .card.kpi-emerald{border-left:4px solid var(--emerald);}
  .card.kpi-garnet{border-left:4px solid var(--garnet);}
  .card.kpi-sapphire{border-left:4px solid #2E5A9C;}
  .card.kpi-amethyst{border-left:4px solid #7B4FA0;}
  .card.kpi-teal{border-left:4px solid #1F8A8C;}
  .card.kpi-bronze{border-left:4px solid #A0622D;}
  .card.kpi-rose{border-left:4px solid #B85C7A;}
  .card.kpi-amber{border-left:4px solid #C98A2B;}
  span.pos{color:var(--emerald);}
  span.neg{color:var(--garnet);}
</style>
</head>

const DB_KEYS = { USERS:'ps3_users', PRODUCTS:'ps3_products', ORDERS:'ps3_orders', EXPENSES:'ps3_expenses', SESSION:'ps3_session', LOG:'ps3_log', SETTINGS:'ps3_settings', CUSTOMERS:'ps3_customers', REGISTERS:'ps3_registers' };
function loadDB(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveDB(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

// Re-renders without losing focus/cursor position in the input the user is
// currently typing in (fixes search boxes losing the cursor every keystroke).
function reRenderKeepFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  let selStart=null, selEnd=null;
  if(active && typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  renderPage();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

}

// Keeps the persisted Customers list in sync whenever a sale is made —
// creates a new customer record, or updates an existing one (matched by
// phone, falling back to name), without overwriting manual admin edits.
function upsertCustomerFromOrder(o){
  const customers = loadDB(DB_KEYS.CUSTOMERS, []);
  const key = (o.phone || o.customerName || '').trim().toLowerCase();
  if(!key) return;
  let c = customers.find(x => (x.phone||x.name||'').trim().toLowerCase() === key);
  if(!c){
    c = { id: uid('c'), name:o.customerName, phone:o.phone||'', city:o.city||'', address:o.address||'', notes:'' };
    customers.push(c);
  } else {
    // Keep existing manually-edited fields but fill in anything missing.
    if(!c.city && o.city) c.city = o.city;
    if(!c.address && o.address) c.address = o.address;
  }
  saveDB(DB_KEYS.CUSTOMERS, customers);
}

function logActivity(action, detail){
  const log = loadDB(DB_KEYS.LOG, []);
  const user = currentUser();
  log.unshift({ id: uid('l'), action, detail, by: user?user.name:'System', at: nowISO() });
  saveDB(DB_KEYS.LOG, log.slice(0, 300));
}

/* ---------- Auth ---------- */
let session = loadDB(DB_KEYS.SESSION, null);
let activeTab = 'dashboard';

function doLogin(){
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const users = loadDB(DB_KEYS.USERS, []);
  const found = users.find(x => x.username === u && x.password === p);
  const msgEl = document.getElementById('login-msg');
  if(!found){ msgEl.innerHTML = '<div class="msg msg-err">Incorrect username or password.</div>'; return; }
  session = { userId: found.id };
  saveDB(DB_KEYS.SESSION, session);
  logActivity('Login', found.name + ' signed in');
  showApp();
}
function doLogout(){
  logActivity('Logout', currentUser()?currentUser().name+' signed out':'');
  session = null;
  localStorage.removeItem(DB_KEYS.SESSION);
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
  document.getElementById('login-msg').innerHTML='';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}
function currentUser(){
  if(!session) return null;
  return loadDB(DB_KEYS.USERS, []).find(u => u.id === session.userId) || null;
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sb-overlay').classList.toggle('active');
}

/* ---------- Navigation ---------- */
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', adminOnly:false},
  {id:'register', label:'Daily Register', adminOnly:false},
  {id:'inventory', label:'Inventory', adminOnly:false},
  {id:'sales', label:'Sales / POS', adminOnly:false},
  {id:'orders', label:'Orders', adminOnly:false},
  {id:'customers', label:'Customers', adminOnly:false},
  {id:'expenses', label:'Expenses', adminOnly:true},
  {id:'analytics', label:'Analytics & P&L', adminOnly:true},
  {id:'team', label:'Team', adminOnly:true},
  {id:'activity', label:'Activity Log', adminOnly:true},
  {id:'settings', label:'Settings', adminOnly:true}
];

function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  const user = currentUser();
  document.getElementById('sb-role').textContent = user.role === 'admin' ? 'Owner Access' : 'Staff Access';
  document.getElementById('sb-name').textContent = user.name;
  renderNav();
  setTab('dashboard');
}
function renderNav(){
  const user = currentUser();
  document.getElementById('sb-nav').innerHTML = NAV_ITEMS.filter(i => !i.adminOnly || user.role==='admin').map(i =>
    `<button class="${i.id===activeTab?'active':''}" onclick="setTab('${i.id}')">${i.label}</button>`
  ).join('');
}
function setTab(id){
  activeTab = id;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('active');
  renderNav();
  renderPage();
}
function renderPage(){
  const user = currentUser();
  if(!user){ doLogout(); return; }
  const main = document.getElementById('main');
  if(activeTab==='dashboard') main.innerHTML = pageDashboard(user);
  else if(activeTab==='register') main.innerHTML = pageRegister(user);
  else if(activeTab==='inventory') main.innerHTML = pageInventory(user);
  else if(activeTab==='sales') main.innerHTML = pageSales(user);
  else if(activeTab==='orders') main.innerHTML = pageOrders(user);
  else if(activeTab==='customers') main.innerHTML = pageCustomers(user);
  else if(activeTab==='expenses' && user.role==='admin') main.innerHTML = pageExpenses(user);
  else if(activeTab==='analytics' && user.role==='admin') main.innerHTML = pageAnalytics(user);
  else if(activeTab==='team' && user.role==='admin') main.innerHTML = pageTeam(user);
  else if(activeTab==='activity' && user.role==='admin') main.innerHTML = pageActivity(user);
  else if(activeTab==='settings' && user.role==='admin') main.innerHTML = pageSettings(user);
  else { activeTab='dashboard'; main.innerHTML = pageDashboard(user); }
}

/* ---------- Shared calc helpers ---------- */
function orderRevenue(o){ return o.items.reduce((s,it)=>s+it.qty*it.unitPrice,0) - (o.discount||0); }
function orderCOGS(o){ return o.items.reduce((s,it)=>s+it.qty*it.unitCost,0); }

/* ---------- Image helper: resize any uploaded image down before storing ---------- */
function resizeImageFile(file, maxSize, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
      else { if(h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function pageDashboard(user){

  const expenses = loadDB(DB_KEYS.EXPENSES, []);

  const today = todayISO();
  const monthPrefix = today.slice(0,7);
  const todayOrders = orders.filter(o => o.date === today);
  const todayRevenue = todayOrders.reduce((s,o)=>s+orderRevenue(o),0);

  const lowStock = products.filter(p => p.stock <= p.lowStock && p.stock > 0);
  const outOfStock = products.filter(p => p.stock <= 0);

    const monthOrders = orders.filter(o => o.date.startsWith(monthPrefix));

    const monthExpenses = expenses.filter(e => e.date.startsWith(monthPrefix)).reduce((s,x)=>s+x.amount,0);
    const grossProfit = monthRevenue - monthCOGS;
    const netProfit = grossProfit - monthExpenses;

    adminCards = `
      ${kpiCard("This Month's Revenue", money(monthRevenue), 'gold')}
      ${kpiCard('Cost of Goods Sold', money(monthCOGS), 'bronze')}

function computeBestSellers(orders){
  const map = {};
  orders.forEach(o => o.items.forEach(it => {
    if(!map[it.name]) map[it.name] = {name:it.name, qty:0, revenue:0};
    map[it.name].qty += it.qty;
    map[it.name].revenue += it.qty*it.unitPrice;
  }));
  return Object.values(map).sort((a,b)=>b.qty-a.qty);
}
function statusPill(status){
  const colors = {
    'Pending':'#8A8A93','Confirmed':'#1565c0','Processing':'#6a1b9a','Shipped':'#00838f',
    'Delivered':'#2F6B4F','Cancelled':'#9B3B3B','Returned':'#9B3B3B'
  };
  const c = colors[status] || '#8A8A93';
  return `<span class="badge" style="background:${c}22;color:${c}">${escapeHtml(status)}</span>`;
}

function handleImageUpload(input){
  const file = input.files[0];
  if(!file) return;
  resizeImageFile(file, 400, (dataUrl)=>{ pendingImageData = dataUrl; renderPage(); });
}
function toggleProductForm(){ showProductForm = !showProductForm; editingProductId = null; pendingImageData = null; renderPage(); }
function startEditProduct(id){ editingProductId = id; showProductForm = true; pendingImageData = null; renderPage(); }
function cancelEdit(){ editingProductId = null; showProductForm = false; pendingImageData = null; renderPage(); }
function saveProduct(){
  const sku = document.getElementById('pf-sku').value.trim();
  const name = document.getElementById('pf-name').value.trim();
  const category = document.getElementById('pf-cat').value.trim() || 'General';
  const costPrice = parseFloat(document.getElementById('pf-cost').value)||0;
  const sellingPrice = parseFloat(document.getElementById('pf-sell').value)||0;
  const stock = parseInt(document.getElementById('pf-stock').value)||0;
  const lowStock = parseInt(document.getElementById('pf-low').value)||5;
  const msgEl = document.getElementById('pf-msg');
  if(!sku || !name){ msgEl.innerHTML = '<div class="msg msg-err">SKU and name are required.</div>'; return; }
  if(costPrice<0 || sellingPrice<0 || stock<0){ msgEl.innerHTML = '<div class="msg msg-err">Prices and stock cannot be negative.</div>'; return; }
  const products = loadDB(DB_KEYS.PRODUCTS, []);
  if(editingProductId){
    const p = products.find(x=>x.id===editingProductId);
    if(p){ p.name=name; p.category=category; p.costPrice=costPrice; p.sellingPrice=sellingPrice; p.stock=stock; p.lowStock=lowStock; p.image=pendingImageData; }
    logActivity('Product edited', name);
  } else {
    if(products.some(p=>p.sku===sku)){ msgEl.innerHTML = '<div class="msg msg-err">This SKU already exists.</div>'; return; }
    products.push({id:uid('p'), sku, name, category, costPrice, sellingPrice, stock, lowStock, image:pendingImageData});
    logActivity('Product added', name + ' (' + sku + ')');
  }
  saveDB(DB_KEYS.PRODUCTS, products);
  showProductForm = false; editingProductId = null; pendingImageData = null;
  renderPage();
}
function duplicateProduct(id){
  const products = loadDB(DB_KEYS.PRODUCTS, []);
  const p = products.find(x=>x.id===id);
  if(!p) return;
  let newSku = p.sku + '-COPY', n=1;
  while(products.some(x=>x.sku===newSku)){ n++; newSku = p.sku+'-COPY'+n; }
  products.push({...p, id:uid('p'), sku:newSku, name:p.name+' (Copy)'});
  saveDB(DB_KEYS.PRODUCTS, products);
  logActivity('Product duplicated', p.name);
  renderPage();
}
function deleteProduct(id){
  const products = loadDB(DB_KEYS.PRODUCTS, []);
  const p = products.find(x=>x.id===id);
  if(!p) return;
  if(!confirm('Delete "'+p.name+'" permanently? This cannot be undone.')) return;
  saveDB(DB_KEYS.PRODUCTS, products.filter(x=>x.id!==id));
  logActivity('Product deleted', p.name);
  renderPage();
}
function updateStock(productId, value){
  const products = loadDB(DB_KEYS.PRODUCTS, []);
  const p = products.find(x=>x.id===productId);
  if(p){ p.stock = Math.max(0, parseInt(value)||0); saveDB(DB_KEYS.PRODUCTS, products); logActivity('Stock adjusted', p.name+' -> '+p.stock); }
  renderPage();
}
function exportInventoryCSV(){
  const products = loadDB(DB_KEYS.PRODUCTS, []);
  const header = ['SKU','Name','Category','Cost Price','Selling Price','Stock','Low Stock Threshold'];
  const rows = products.map(p=>[p.sku,p.name,p.category,p.costPrice,p.sellingPrice,p.stock,p.lowStock]);
  downloadCSV('prince-star-inventory.csv', header, rows);
}
function downloadCSV(filename, header, rows){
  const csv = [header, ...rows].map(r => r.map(cell => {
    const s = String(cell==null?'':cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function addToCart(){
  const sel = document.getElementById('s-product');
  const productId = sel.value;
  const qty = parseInt(document.getElementById('s-qty').value)||1;
  if(!productId) return;
  const products = loadDB(DB_KEYS.PRODUCTS, []);
  const p = products.find(x=>x.id===productId);
  if(!p) return;
  const inCartQty = cart.filter(c=>c.productId===productId).reduce((s,c)=>s+c.qty,0);
  if(inCartQty+qty > p.stock){ alert('Only '+p.stock+' in stock.'); return; }
  const existing = cart.find(c=>c.productId===productId);
  if(existing){ existing.qty += qty; }
  else cart.push({ productId, name:p.name, qty, unitPrice:p.sellingPrice, unitCost:p.costPrice });
  renderPage();
}
function updateCartQty(index, value){
  const qty = Math.max(1, parseInt(value)||1);
  cart[index].qty = qty;
  renderPage();
}
function removeFromCart(index){ cart.splice(index,1); renderPage(); }
function checkoutOrder(){
  const msgEl = document.getElementById('sale-msg');
  if(cart.length===0){ msgEl.innerHTML = '<div class="msg msg-err">Add at least one item to the cart.</div>'; return; }
  const customerName = document.getElementById('s-customer').value.trim();
  if(!customerName){ msgEl.innerHTML = '<div class="msg msg-err">Customer name is required.</div>'; return; }

  const products = loadDB(DB_KEYS.PRODUCTS, []);
  for(const c of cart){
    const p = products.find(x=>x.id===c.productId);
    if(!p || p.stock < c.qty){ msgEl.innerHTML = '<div class="msg msg-err">Not enough stock for '+escapeHtml(c.name)+'.</div>'; return; }
  }

  const s = getSettings();
  const order = {
    id: uid('o'), orderNo: s.invoicePrefix + '-' + Date.now().toString().slice(-6),
    items: cart.map(c=>({productId:c.productId, name:c.name, qty:c.qty, unitPrice:c.unitPrice, unitCost:c.unitCost})),
    discount: parseFloat(document.getElementById('s-discount').value)||0,
    shipping: parseFloat(document.getElementById('s-shipping').value)||0,
    customerName, phone: document.getElementById('s-phone').value.trim(),
    city: document.getElementById('s-city').value.trim(), address: document.getElementById('s-address').value.trim(),
    notes: document.getElementById('s-notes').value.trim(),
    paymentMethod: document.getElementById('s-payment').value,
    paymentStatus: document.getElementById('s-paystatus').value,
    orderStatus: document.getElementById('s-orderstatus').value,
    date: todayISO(), soldBy: currentUser().id
  };
  const orders = loadDB(DB_KEYS.ORDERS, []);
  orders.push(order);
  saveDB(DB_KEYS.ORDERS, orders);

  cart.forEach(c=>{ const p = products.find(x=>x.id===c.productId); p.stock -= c.qty; });
  saveDB(DB_KEYS.PRODUCTS, products);
  upsertCustomerFromOrder(order);
  logActivity('Sale recorded', order.orderNo + ' — ' + customerName);

  cart = [];
  msgEl.innerHTML = '<div class="msg msg-ok">Order '+order.orderNo+' confirmed.</div>';
  setTimeout(()=>{ activeTab='orders'; renderNav(); renderPage(); }, 500);
}

function deleteOrder(orderId){
  const orders = loadDB(DB_KEYS.ORDERS, []);
  const o = orders.find(x=>x.id===orderId);
  if(!o) return;
  if(!confirm('Delete order '+(o.orderNo||o.id)+' permanently?\n\nStock for its items will be restored back into inventory. This cannot be undone.')) return;
  const products = loadDB(DB_KEYS.PRODUCTS, []);
  o.items.forEach(it=>{ const p = products.find(x=>x.id===it.productId); if(p) p.stock += it.qty; });
  saveDB(DB_KEYS.PRODUCTS, products);
  saveDB(DB_KEYS.ORDERS, orders.filter(x=>x.id!==orderId));
  logActivity('Order deleted', o.orderNo||o.id);
  renderPage();
}

function openRegister(){
  const stale = loadDB(DB_KEYS.REGISTERS, []).find(r => r.status==='Open' && r.date !== todayISO());
  if(stale){ alert('Please close the unclosed register from '+stale.date+' first.'); return; }
  const openingCash = parseFloat(document.getElementById('reg-opening-cash').value)||0;
  const registers = loadDB(DB_KEYS.REGISTERS, []);
  registers.push({
    id: uid('r'), date: todayISO(), status:'Open',
    openedAt: nowISO(), closedAt:null,
    openedBy: currentUser().name, closedBy:null,
    openingCash, cashIn:[], cashOut:[], notes:[]
  });
  saveDB(DB_KEYS.REGISTERS, registers);
  logActivity('Register opened', 'Opening cash: '+money(openingCash));
  renderPage();
}
function addRegisterCash(){
  const type = document.getElementById('reg-cash-type').value;
  const amount = parseFloat(document.getElementById('reg-cash-amount').value)||0;
  const note = document.getElementById('reg-cash-note').value.trim();
  const msgEl = document.getElementById('reg-cash-msg');
  if(amount<=0){ msgEl.innerHTML = '<div class="msg msg-err">Enter a valid amount.</div>'; return; }
  const registers = loadDB(DB_KEYS.REGISTERS, []);
  const open = registers.find(r=>r.status==='Open' && r.date===todayISO());
  if(!open) return;
  const entry = { amount, note, at: nowISO(), by: currentUser().name };
  if(type==='in'){ open.cashIn = open.cashIn||[]; open.cashIn.push(entry); }
  else { open.cashOut = open.cashOut||[]; open.cashOut.push(entry); }
  saveDB(DB_KEYS.REGISTERS, registers);
  logActivity('Register cash '+type, money(amount)+(note?' — '+note:''));
  renderPage();
}
function addRegisterNote(){
  const text = document.getElementById('reg-note-text').value.trim();
  const msgEl = document.getElementById('reg-note-msg');
  if(!text){ msgEl.innerHTML = '<div class="msg msg-err">Write a note first.</div>'; return; }
  const registers = loadDB(DB_KEYS.REGISTERS, []);
  const open = registers.find(r=>r.status==='Open' && r.date===todayISO());
  if(!open) return;
  open.notes = open.notes||[];
  open.notes.push({ text, at: nowISO(), by: currentUser().name });
  saveDB(DB_KEYS.REGISTERS, registers);
  logActivity('Register note added', text);
  renderPage();
}
function closeRegister(){
  if(!confirm("Close today's register?\n\nThis locks in today's totals as a permanent historical record. You can open a new register tomorrow.")) return;
  const registers = loadDB(DB_KEYS.REGISTERS, []);
  const open = registers.find(r=>r.status==='Open' && r.date===todayISO());
  if(!open) return;
  const todayOrders = loadDB(DB_KEYS.ORDERS, []).filter(o=>o.date===todayISO());
  const todaySales = todayOrders.reduce((s,o)=>s+orderRevenue(o),0);
  const todayExpenses = loadDB(DB_KEYS.EXPENSES, []).filter(e=>e.date===todayISO()).reduce((s,x)=>s+x.amount,0);
  const cashIn = (open.cashIn||[]).reduce((s,x)=>s+x.amount,0);
  const cashOut = (open.cashOut||[]).reduce((s,x)=>s+x.amount,0);
  const cashSales = todayOrders.filter(o=>['Cash','COD'].includes(o.paymentMethod)).reduce((s,o)=>s+orderRevenue(o),0);
  const products = loadDB(DB_KEYS.PRODUCTS, []);

  open.status = 'Closed';
  open.closedAt = nowISO();
  open.closedBy = currentUser().name;
  open.totalSales = todaySales;
  open.totalExpenses = todayExpenses;
  open.ordersCount = todayOrders.length;
  open.closingCash = (open.openingCash||0) + cashSales + cashIn - cashOut - todayExpenses;
  open.inventoryValueAtClose = products.reduce((s,p)=>s+p.stock*p.costPrice,0);
  open.lowStockAtClose = products.filter(p=>p.stock<=p.lowStock).length;

  saveDB(DB_KEYS.REGISTERS, registers);
  logActivity('Register closed', open.date+' — closing cash '+money(open.closingCash));
  renderPage();
}

/* ---------- Generic print / "Save as PDF" helper ----------

function printDocument(bodyHtml){
  document.getElementById('print-area').innerHTML = '<div class="doc-frame">' + bodyHtml + '</div>';
  document.body.classList.add('printing-doc');

  const isAdmin = user.role === 'admin';
  const orders = loadDB(DB_KEYS.ORDERS, []);
  const customers = loadDB(DB_KEYS.CUSTOMERS, []);

  // Compute live order stats per customer (matched by phone, falling back to name).
  const statsMap = {};
  orders.forEach(o=>{
    const key = (o.phone||o.customerName||'').trim().toLowerCase();
    if(!key) return;
    if(!statsMap[key]) statsMap[key] = { orders:0, spent:0, lastOrder:o.date };
    statsMap[key].orders += 1;
    statsMap[key].spent += orderRevenue(o);
    if(o.date > statsMap[key].lastOrder) statsMap[key].lastOrder = o.date;
  });

  let list = customers.map(c=>{
    const key = (c.phone||c.name||'').trim().toLowerCase();
    const stats = statsMap[key] || { orders:0, spent:0, lastOrder:'—' };
    return Object.assign({}, c, stats);
  }).sort((a,b)=>b.spent-a.spent);

  if(custSearch){
    const q = custSearch.toLowerCase();
    list = list.filter(c => (c.name||'').toLowerCase().includes(q) || (c.phone||'').toLowerCase().includes(q) || (c.city||'').toLowerCase().includes(q));
  }
  window._customersForExport = list;

  const editing = editingCustomerId ? customers.find(c=>c.id===editingCustomerId) : null;
  const editFormHtml = editing ? `
    <div class="card form-panel">
      <div id="cust-edit-msg"></div>
      <h3 class="crown" style="margin-bottom:10px;font-size:15px">Edit Customer</h3>
      <div class="form-grid">
        <div><label>Name</label><input id="ce-name" value="${escapeHtml(editing.name)}"></div>
        <div><label>Phone</label><input id="ce-phone" value="${escapeHtml(editing.phone||'')}"></div>
        <div><label>City</label><input id="ce-city" value="${escapeHtml(editing.city||'')}"></div>
        <div class="field-full"><label>Address</label><input id="ce-address" value="${escapeHtml(editing.address||'')}"></div>
        <div class="field-full"><label>Notes</label><input id="ce-notes" value="${escapeHtml(editing.notes||'')}"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-gold" style="width:auto;padding:10px 20px" onclick="saveCustomerEdit()">Save Changes</button>
        <button class="btn btn-ghost" style="width:auto;padding:10px 20px" onclick="editingCustomerId=null;renderPage();">Cancel</button>
      </div>
    </div>
  ` : '';

  const rows = list.map(c=>`<tr>
    <td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.phone||'—')}</td><td>${escapeHtml(c.city||'—')}</td>
    <td class="right">${c.orders}</td><td class="right">${money(c.spent)}</td><td class="right">${c.lastOrder}</td>
    ${isAdmin ? `<td class="right">
      <button class="icon-btn" title="Edit" onclick="editingCustomerId='${c.id}'; renderPage();">✏️</button>
      <button class="icon-btn danger" title="Delete" onclick="deleteCustomer('${c.id}')">🗑️</button>
    </td>` : ''}
  </tr>`).join('') || `<tr><td colspan="${isAdmin?7:6}" class="empty-row">${custSearch?'No customers match your search.':'No customers yet — record a sale to see them here.'}</td></tr>`;

  return `
    <div class="page-head"><div><h1 class="crown">Customers</h1><p>Built automatically from sales — editable by the owner</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="exportCustomersCSV()">Export CSV</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <input id="cust-search-input" placeholder="Search by name, phone or city…" value="${escapeHtml(custSearch)}" style="width:100%;padding:10px;border:1px solid rgba(0,0,0,.12);border-radius:9px" oninput="custSearch=this.value; reRenderKeepFocus();">
    </div>
    ${editFormHtml}
    <div class="card table-wrap">
      <table><thead><tr><th>Name</th><th>Phone</th><th>City</th><th class="right">Orders</th><th class="right">Total Spent</th><th class="right">Last Order</th>${isAdmin?'<th class="right">Actions</th>':''}</tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
  `;
}
function saveCustomerEdit(){
  const name = document.getElementById('ce-name').value.trim();
  const phone = document.getElementById('ce-phone').value.trim();
  const city = document.getElementById('ce-city').value.trim();
  const address = document.getElementById('ce-address').value.trim();

/* ============================================================ EXPENSES */
let expSearch = '';
let expFrom = '';
let expTo = '';
function pageExpenses(user){
  let expenses = loadDB(DB_KEYS.EXPENSES, []).slice().reverse();
  if(expSearch){
    const q = expSearch.toLowerCase();
    expenses = expenses.filter(e => (e.category||'').toLowerCase().includes(q) || (e.description||'').toLowerCase().includes(q));
  }
  if(expFrom) expenses = expenses.filter(e => e.date >= expFrom);
  if(expTo) expenses = expenses.filter(e => e.date <= expTo);
  window._expensesForExport = expenses;

  const today = todayISO();
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  const weekAgoISO = weekAgo.toISOString().slice(0,10);
  const monthPrefix = today.slice(0,7);
  const yearPrefix = today.slice(0,4);
  const allExpenses = loadDB(DB_KEYS.EXPENSES, []);
  const weekTotal = allExpenses.filter(e=>e.date>=weekAgoISO).reduce((s,x)=>s+x.amount,0);
  const monthTotal = allExpenses.filter(e=>e.date.startsWith(monthPrefix)).reduce((s,x)=>s+x.amount,0);
  const yearTotal = allExpenses.filter(e=>e.date.startsWith(yearPrefix)).reduce((s,x)=>s+x.amount,0);
  const filteredTotal = expenses.reduce((s,x)=>s+x.amount,0);

  const catMap = {};
  expenses.forEach(e => { catMap[e.category] = (catMap[e.category]||0) + e.amount; });
  const catRows = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>{
    const pct = filteredTotal>0 ? Math.round((amt/filteredTotal)*100) : 0;

      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${escapeHtml(cat)}</span><span>${money(amt)} (${pct}%)</span></div>
      <div style="background:rgba(0,0,0,.06);border-radius:6px;height:6px"><div style="width:${pct}%;background:linear-gradient(90deg,var(--gold-light),var(--gold-dark));height:6px;border-radius:6px"></div></div>
    </div>`;

  const rows = expenses.map(e =>

    <td class="right"><button class="icon-btn danger" title="Delete" onclick="deleteExpense('${e.id}')">🗑️</button></td></tr>`

  return `
    <div class="page-head"><div><h1 class="crown">Expenses</h1><p>Operational costs — marketing, packaging, delivery, billing, and more</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="exportExpensesCSV()">Export CSV</button>
        <button class="btn btn-ghost" onclick="printExpensesReport()">Export PDF</button>
      </div>
    </div>
    <div class="grid grid-4" style="margin-bottom:16px">
      ${kpiCard('Last 7 Days', money(weekTotal), 'sapphire')}
      ${kpiCard('This Month', money(monthTotal), 'rose')}
      ${kpiCard('This Year', money(yearTotal), 'bronze')}
      ${kpiCard('Filtered Total', money(filteredTotal), 'gold')}
    </div>
    <div style="display:grid;grid-template-columns:2fr 3fr;gap:20px" id="exp-grid">
    <div class="card">
      <div id="exp-msg"></div>
      <div style="margin-bottom:10px"><label style="display:block;font-size:10.2px;color:var(--slate-d);text-transform:uppercase;margin-bottom:4px">Category</label>
        <select id="e-cat" style="width:100%;padding:10px;border:1px solid rgba(0,0,0,.12);border-radius:9px">
          <option>Marketing</option><option>Advertising</option><option>Packaging</option><option>Shipping</option><option>Delivery</option><option>Salaries</option><option>Rent</option><option>Utilities</option><option>Software</option><option>Website</option><option>Office</option><option>Other</option>
        </select>
      </div>
      <div style="margin-bottom:10px"><label style="display:block;font-size:10.2px;color:var(--slate-d);text-transform:uppercase;margin-bottom:4px">Amount</label><input id="e-amount" type="number" style="width:100%;padding:10px;border:1px solid rgba(0,0,0,.12);border-radius:9px"></div>
      <div style="margin-bottom:10px"><label style="display:block;font-size:10.2px;color:var(--slate-d);text-transform:uppercase;margin-bottom:4px">Date</label><input id="e-date" type="date" value="${todayISO()}" style="width:100%;padding:10px;border:1px solid rgba(0,0,0,.12);border-radius:9px"></div>
      <div style="margin-bottom:12px"><label style="display:block;font-size:10.2px;color:var(--slate-d);text-transform:uppercase;margin-bottom:4px">Description</label><textarea id="e-desc" rows="2" style="width:100%;padding:10px;border:1px solid rgba(0,0,0,.12);border-radius:9px"></textarea></div>
      <button class="btn btn-gold" onclick="addExpense()">Log Expense</button>
      <hr style="margin:16px 0;border:none;border-top:1px solid rgba(0,0,0,.06)">
      <div style="font-size:11px;color:var(--slate-d);text-transform:uppercase;margin-bottom:8px">Category Breakdown</div>
      ${catRows}
    </div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr">
          <div><label>Search</label><input id="exp-search-input" placeholder="Category or description…" value="${escapeHtml(expSearch)}" oninput="expSearch=this.value; reRenderKeepFocus();"></div>
          <div><label>From</label><input id="exp-from-input" type="date" value="${expFrom}" onchange="expFrom=this.value; renderPage();"></div>
          <div><label>To</label><input id="exp-to-input" type="date" value="${expTo}" onchange="expTo=this.value; renderPage();"></div>
        </div>
      </div>
      <div class="card table-wrap">
        <table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="right">Amount</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      </div>
    </div>
    </div>
    <style>@media(max-width:900px){#exp-grid{grid-template-columns:1fr !important;}}</style>
  `;
}
function addExpense(){
  const category = document.getElementById('e-cat').value;
  const amount = parseFloat(document.getElementById('e-amount').value)||0;
  const date = document.getElementById('e-date').value || todayISO();
  const description = document.getElementById('e-desc').value.trim();
  const msgEl = document.getElementById('exp-msg');
  if(amount<=0){ msgEl.innerHTML='<div class="msg msg-err">Enter a valid amount.</div>'; return; }
  const expenses = loadDB(DB_KEYS.EXPENSES, []);
  expenses.push({id:uid('e'), category, amount, date, description});
  saveDB(DB_KEYS.EXPENSES, expenses);
  logActivity('Expense added', category+' — '+money(amount));
  renderPage();
}
function deleteExpense(id){
  if(!confirm('Delete this expense entry?')) return;

  saveDB(DB_KEYS.EXPENSES, expenses.filter(x=>x.id!==id));

}
function exportExpensesCSV(){

/* ============================================================ ANALYTICS */
let analyticsDays = 14;
function pageAnalytics(user){
  const orders = loadDB(DB_KEYS.ORDERS, []);
  const expenses = loadDB(DB_KEYS.EXPENSES, []);
  const days = analyticsDays;
  const today = new Date();
  const series = [];
  for(let i=days-1;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const dayOrders = orders.filter(o=>o.date===iso);
    const revenue = dayOrders.reduce((s,o)=>s+orderRevenue(o),0);
    const cogs = dayOrders.reduce((s,o)=>s+orderCOGS(o),0);
    const exp = expenses.filter(e=>e.date===iso).reduce((s,x)=>s+x.amount,0);
    series.push({date: iso.slice(5), revenue, cogs, exp, profit: revenue-cogs-exp});
  }
  const totals = series.reduce((acc,d)=>({revenue:acc.revenue+d.revenue,cogs:acc.cogs+d.cogs,exp:acc.exp+d.exp,profit:acc.profit+d.profit}),{revenue:0,cogs:0,exp:0,profit:0});
  const totalOrders = orders.filter(o=>{
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
    return new Date(o.date) >= cutoff;
  }).length;
  const avgOrderValue = totalOrders>0 ? totals.revenue/totalOrders : 0;
  const margin = totals.revenue>0 ? ((totals.profit/totals.revenue)*100).toFixed(1) : '0.0';
  const maxVal = Math.max(1, ...series.map(d=>Math.max(d.revenue, Math.abs(d.profit))));

  const bars = series.map(d => `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="display:flex;align-items:flex-end;gap:2px;height:150px;width:100%">
        <div style="width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--gold-light),var(--gold-dark));height:${Math.max(2,(d.revenue/maxVal)*150)}px"></div>
        <div style="width:100%;border-radius:4px 4px 0 0;background:${d.profit<0?'var(--garnet)':'var(--emerald)'};height:${Math.max(2,(Math.abs(d.profit)/maxVal)*150)}px"></div>
      </div>
      <div style="font-size:9px;color:var(--slate-d)">${d.date}</div>
    </div>`).join('');

  const rangeTabs = [7,14,30,90].map(n=>`<button class="tab-btn ${analyticsDays===n?'active':''}" onclick="analyticsDays=${n};renderPage();">${n} Days</button>`).join('');

  return `
    <div class="page-head"><div><h1 class="crown">Analytics & P&L</h1><p>Net Profit = Total Sales − Cost of Goods − Expenses</p></div>
      <button class="btn btn-ghost" onclick="exportAnalyticsCSV()">Export CSV</button></div>
    <div class="tabs-row">${rangeTabs}</div>
    <div class="grid grid-4" style="margin-bottom:20px">
      <div class="card"><div class="stat-label">Total Sales</div><div class="stat-value">${money(totals.revenue)}</div></div>
      <div class="card"><div class="stat-label">Cost of Goods</div><div class="stat-value">${money(totals.cogs)}</div></div>
      <div class="card"><div class="stat-label">Expenses</div><div class="stat-value">${money(totals.exp)}</div></div>
      <div class="card"><div class="stat-label">Net Profit</div><div class="stat-value ${totals.profit>=0?'pos':'neg'}">${money(totals.profit)}</div><div class="kpi-sub">Margin: ${margin}%</div></div>
      <div class="card"><div class="stat-label">Total Orders</div><div class="stat-value">${totalOrders}</div></div>
      <div class="card"><div class="stat-label">Avg Order Value</div><div class="stat-value">${money(avgOrderValue)}</div></div>
    </div>
    <div class="card">
      <h3 class="crown" style="margin-bottom:6px;font-size:16px">Revenue (gold) vs Net Profit (green/red)</h3>
      <div style="display:flex;align-items:flex-end;gap:6px;padding-top:10px">${bars}</div>
    </div>
  `;
}
function exportAnalyticsCSV(){
  const orders = loadDB(DB_KEYS.ORDERS, []);
  const expenses = loadDB(DB_KEYS.EXPENSES, []);
  const days = analyticsDays;
  const today = new Date();
  const rows = [];
  for(let i=days-1;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const dayOrders = orders.filter(o=>o.date===iso);
    const revenue = dayOrders.reduce((s,o)=>s+orderRevenue(o),0);
    const cogs = dayOrders.reduce((s,o)=>s+orderCOGS(o),0);
    const exp = expenses.filter(e=>e.date===iso).reduce((s,x)=>s+x.amount,0);
    rows.push([iso, revenue, cogs, exp, revenue-cogs-exp]);
  }
  downloadCSV('prince-star-analytics.csv', ['Date','Revenue','COGS','Expenses','Net Profit'], rows);
}

function addTeamMember(){
  const name = document.getElementById('t-name').value.trim();
  const username = document.getElementById('t-user').value.trim();
  const password = document.getElementById('t-pass').value;
  const role = document.getElementById('t-role').value;
  const msgEl = document.getElementById('team-msg');
  if(!name||!username||password.length<4){ msgEl.innerHTML='<div class="msg msg-err">Fill all fields (password min 4 chars).</div>'; return; }
  const users = loadDB(DB_KEYS.USERS, []);
  if(users.some(u=>u.username===username)){ msgEl.innerHTML='<div class="msg msg-err">Username already taken.</div>'; return; }
  users.push({id:uid('u'), name, username, password, role});
  saveDB(DB_KEYS.USERS, users);
  logActivity('Team member added', name+' ('+role+')');
  renderPage();
}
function changeRole(userId, role){
  const users = loadDB(DB_KEYS.USERS, []);
  const u = users.find(x=>x.id===userId);
  if(u){ u.role = role; saveDB(DB_KEYS.USERS, users); logActivity('Permission changed', u.name+' -> '+role); }
  renderPage();
}
function deleteTeamMember(userId){
  if(!confirm('Remove this team member?')) return;
  const users = loadDB(DB_KEYS.USERS, []);
  const u = users.find(x=>x.id===userId);
  saveDB(DB_KEYS.USERS, users.filter(u=>u.id!==userId));
  logActivity('Team member removed', u?u.name:'');
  renderPage();
}

let pendingLogoData = null;

        Permanently erase all products, orders, customers, expenses and activity history from this device.
        Your team logins and business settings will be kept so you don't get locked out.
      </p>
      <button class="btn" style="width:auto;padding:10px 20px;background:rgba(155,59,59,.1);color:var(--garnet);border:1px solid rgba(155,59,59,.3)" onclick="clearAllData()">Clear All Data</button>
    </div>
  `;

function clearAllData(){
  const step1 = prompt('This will permanently delete ALL products, orders, customers, expenses, daily registers and activity history.\n\nTeam logins and business settings will be kept.\n\nType DELETE (in capitals) to confirm:');
  if(step1 !== 'DELETE'){ if(step1!==null) alert('Not confirmed — nothing was deleted.'); return; }
  saveDB(DB_KEYS.PRODUCTS, []);
  saveDB(DB_KEYS.ORDERS, []);
  saveDB(DB_KEYS.EXPENSES, []);
  saveDB(DB_KEYS.CUSTOMERS, []);
  saveDB(DB_KEYS.REGISTERS, []);
  saveDB(DB_KEYS.LOG, []);
  logActivity('All data cleared', 'By ' + (currentUser()?currentUser().name:''));
  alert('All business data has been cleared. The page will now reload.');
  location.reload();
}
function handleLogoUpload(input){
  const file = input.files[0];
  if(!file) return;
  resizeImageFile(file, 300, (dataUrl)=>{ pendingLogoData = dataUrl; renderPage(); });
}
function saveSettingsForm(){
  const s = getSettings();
  s.businessName = document.getElementById('set-name').value.trim() || 'Prince Star';
  s.tagline = document.getElementById('set-tagline').value.trim();
  s.phone = document.getElementById('set-phone').value.trim();
  s.whatsapp = document.getElementById('set-whatsapp').value.trim();
  s.email = document.getElementById('set-email').value.trim();
  s.currency = document.getElementById('set-currency').value.trim() || 'Rs';
  s.address = document.getElementById('set-address').value.trim();
  s.invoicePrefix = document.getElementById('set-invprefix').value.trim() || 'PS';
  s.lowStockDefault = parseInt(document.getElementById('set-lowstock').value) || 5;
  if(pendingLogoData) s.logoBase64 = pendingLogoData;
  saveSettings(s);
  logActivity('Settings updated', 'Business profile changed');
  pendingLogoData = null;
  document.getElementById('settings-msg').innerHTML = '<div class="msg msg-ok">Settings saved.</div>';
  setTimeout(()=>renderPage(), 600);
}
function exportBackup(){
  const backup = {
    exportedAt: nowISO(),
    users: loadDB(DB_KEYS.USERS, []),
    products: loadDB(DB_KEYS.PRODUCTS, []),
    orders: loadDB(DB_KEYS.ORDERS, []),
    expenses: loadDB(DB_KEYS.EXPENSES, []),
    settings: getSettings()
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'prince-star-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logActivity('Backup exported', '');
}
function restoreBackup(input){
  const file = input.files[0];
  if(!file) return;
  if(!confirm('This will REPLACE all current data with the backup file. Continue?')) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(data.users) saveDB(DB_KEYS.USERS, data.users);
      if(data.products) saveDB(DB_KEYS.PRODUCTS, data.products);
      if(data.orders) saveDB(DB_KEYS.ORDERS, data.orders);
      if(data.expenses) saveDB(DB_KEYS.EXPENSES, data.expenses);
      if(data.settings) saveDB(DB_KEYS.SETTINGS, data.settings);
      logActivity('Backup restored', '');
      alert('Backup restored successfully. The page will now reload.');
      location.reload();
    }catch(err){
      alert('Could not read this backup file. Make sure it is a valid Prince Star backup JSON.');
    }
  };
  reader.readAsText(file);
}

/* ---------- Boot ---------- */
if(session && currentUser()) showApp();
</script>
